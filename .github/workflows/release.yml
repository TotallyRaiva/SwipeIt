name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Publish Release DMG
    runs-on: macos-14
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Verify Xcode version
        run: xcodebuild -version

      - name: Build and Package DMG
        run: |
          chmod +x ./scripts/build_dmg.sh
          ./scripts/build_dmg.sh > /tmp/build.log 2>&1 || {
            tail -n 30 /tmp/build.log | while IFS= read -r line; do
              echo "::error title=Build Failure::$line"
            done
            exit 1
          }
          cat /tmp/build.log

      - name: Upload Release Assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/SwipeIt.dmg
            dist/SwipeIt.dmg.sha256
          generate_release_notes: true
          draft: false
          prerelease: false
