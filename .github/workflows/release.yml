name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Publish Release DMG
    runs-on: macos-15
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Select Xcode 16
        run: |
          sudo xcode-select -s /Applications/Xcode_16.2.app 2>/dev/null || \
          sudo xcode-select -s /Applications/Xcode_16.1.app 2>/dev/null || \
          sudo xcode-select -s /Applications/Xcode_16.0.app 2>/dev/null || \
          sudo xcode-select -s /Applications/Xcode_16.app 2>/dev/null || \
          sudo xcode-select -s /Applications/Xcode.app

      - name: Verify Xcode version
        run: xcodebuild -version

      - name: Run Unit Tests
        run: |
          xcodebuild test \
            -project SwipeIt.xcodeproj \
            -scheme SwipeIt \
            -destination "platform=macOS" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Build and Package DMG
        run: |
          chmod +x ./scripts/build_dmg.sh
          ./scripts/build_dmg.sh > /tmp/build.log 2>&1 || {
            tail -n 30 /tmp/build.log | while IFS= read -r line; do
              echo "::error title=Build Failure::$line"
            done
            exit 1
          }
          cat /tmp/build.log

      - name: Upload Release Assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/SwipeIt.dmg
            dist/SwipeIt.dmg.sha256
          generate_release_notes: true
          draft: false
          prerelease: false
