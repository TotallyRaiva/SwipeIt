name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-macos:
    name: Build macOS DMG
    runs-on: macos-15
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Select Xcode 16
        run: |
          sudo xcode-select -s /Applications/Xcode_16.2.app 2>/dev/null || \
          sudo xcode-select -s /Applications/Xcode_16.1.app 2>/dev/null || \
          sudo xcode-select -s /Applications/Xcode_16.0.app 2>/dev/null || \
          sudo xcode-select -s /Applications/Xcode_16.app 2>/dev/null || \
          sudo xcode-select -s /Applications/Xcode.app

      - name: Run macOS Unit Tests
        run: |
          xcodebuild test \
            -project SwipeIt.xcodeproj \
            -scheme SwipeIt \
            -destination "platform=macOS" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Build and Package DMG
        run: |
          chmod +x ./scripts/build_dmg.sh
          ./scripts/build_dmg.sh

      - name: Upload macOS Artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-release
          path: |
            dist/SwipeIt.dmg
            dist/SwipeIt.dmg.sha256

  build-windows:
    name: Build Windows Executable
    runs-on: windows-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Install Rust Stable
        uses: dtolnay/rust-toolchain@stable

      - name: Run Unit Tests
        working-directory: crossplatform
        run: cargo test

      - name: Build Windows Release EXE
        working-directory: crossplatform
        run: cargo build --release

      - name: Stage Windows Asset & Checksum
        shell: bash
        run: |
          mkdir -p dist
          cp crossplatform/target/release/SwipeIt.exe dist/SwipeIt-Windows-x64.exe
          cd dist
          sha256sum SwipeIt-Windows-x64.exe > SwipeIt-Windows-x64.exe.sha256

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: |
            dist/SwipeIt-Windows-x64.exe
            dist/SwipeIt-Windows-x64.exe.sha256

  build-linux:
    name: Build Linux Archive
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Install Linux Display Headers
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libxcb-render0-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libxkbcommon-dev \
            libssl-dev \
            libgtk-3-dev

      - name: Install Rust Stable
        uses: dtolnay/rust-toolchain@stable

      - name: Run Unit Tests
        working-directory: crossplatform
        run: cargo test

      - name: Build Linux Release Binary
        working-directory: crossplatform
        run: cargo build --release

      - name: Package Linux Tarball & Checksum
        run: |
          mkdir -p dist
          cp crossplatform/target/release/SwipeIt dist/SwipeIt
          chmod +x dist/SwipeIt
          cd dist
          tar -czf SwipeIt-Linux-x86_64.tar.gz SwipeIt
          shasum -a 256 SwipeIt-Linux-x86_64.tar.gz > SwipeIt-Linux-x86_64.tar.gz.sha256

      - name: Upload Linux Artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-release
          path: |
            dist/SwipeIt-Linux-x86_64.tar.gz
            dist/SwipeIt-Linux-x86_64.tar.gz.sha256

  publish-release:
    name: Publish Multi-OS GitHub Release
    runs-on: ubuntu-latest
    needs: [build-macos, build-windows, build-linux]
    steps:
      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Upload Release Assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-assets/SwipeIt.dmg
            release-assets/SwipeIt.dmg.sha256
            release-assets/SwipeIt-Windows-x64.exe
            release-assets/SwipeIt-Windows-x64.exe.sha256
            release-assets/SwipeIt-Linux-x86_64.tar.gz
            release-assets/SwipeIt-Linux-x86_64.tar.gz.sha256
          generate_release_notes: true
          draft: false
          prerelease: false
