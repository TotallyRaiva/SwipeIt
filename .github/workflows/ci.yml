name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  test-macos:
    name: macOS Swift Unit Tests
    runs-on: macos-15
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Select Xcode 16
        run: |
          sudo xcode-select -s /Applications/Xcode_16.2.app 2>/dev/null || \
          sudo xcode-select -s /Applications/Xcode_16.1.app 2>/dev/null || \
          sudo xcode-select -s /Applications/Xcode_16.0.app 2>/dev/null || \
          sudo xcode-select -s /Applications/Xcode_16.app 2>/dev/null || \
          sudo xcode-select -s /Applications/Xcode.app

      - name: Run macOS Test Suite
        run: |
          xcodebuild test \
            -project SwipeIt.xcodeproj \
            -scheme SwipeIt \
            -destination "platform=macOS" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

  test-windows:
    name: Windows Rust Build & Tests
    runs-on: windows-latest
    defaults:
      run:
        working-directory: crossplatform
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Install Rust Stable
        uses: dtolnay/rust-toolchain@stable

      - name: Run Unit Tests (Windows)
        run: cargo test

      - name: Build Windows Release Executable
        run: cargo build --release

  test-linux:
    name: Linux Rust Build & Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: crossplatform
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Install Linux Display & Input Headers
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libxcb-render0-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libxkbcommon-dev \
            libssl-dev \
            libgtk-3-dev

      - name: Install Rust Stable
        uses: dtolnay/rust-toolchain@stable

      - name: Run Unit Tests (Linux)
        run: cargo test

      - name: Build Linux Release Binary
        run: cargo build --release
